[project]
name = "docs-rag"
version = "0.1.0"
description = "Ask questions about your own documents: LangChain + Chroma + Claude + FastAPI + React"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0",
    "fastapi>=0.115",
    "fastembed>=0.6",
    "langchain-anthropic>=0.3",
    "langchain-chroma>=0.2",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "pydantic-settings>=2.5",
    "pypdf>=5.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
